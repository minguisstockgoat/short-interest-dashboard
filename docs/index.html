<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국내 공매도 잔고 대시보드</title>
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s1soft:rgba(42,120,214,.12);
  --up:#d03b3b; --down:#2a78d6; --warn:#fab219;
  --hi:rgba(42,120,214,.08);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s1soft:rgba(57,135,229,.16);
    --up:#e66767; --down:#3987e5;
    --hi:rgba(57,135,229,.12);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19;
  --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s1soft:rgba(57,135,229,.16);
  --up:#e66767; --down:#3987e5;
  --hi:rgba(57,135,229,.12);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:19px; margin:0; font-weight:650; letter-spacing:-.01em}
.wrap{max-width:1800px; margin:0 auto; padding:18px 20px 60px}

header{display:flex; flex-wrap:wrap; gap:14px 20px; align-items:baseline; margin-bottom:6px}
.meta{color:var(--ink2); font-size:12.5px}
.meta b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.banner{
  margin:12px 0; padding:10px 13px; border-radius:8px; font-size:13px;
  background:rgba(250,178,25,.13); border:1px solid rgba(250,178,25,.35); color:var(--ink);
}
.banner code{background:var(--border); padding:1px 5px; border-radius:4px; font-size:12px}

.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:14px 0 10px}
input[type=search],select{
  font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--border); border-radius:7px; padding:6px 10px;
}
input[type=search]{min-width:210px}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; background:var(--surface)}
.seg button{
  font:inherit; border:0; background:transparent; color:var(--ink2);
  padding:6px 12px; cursor:pointer;
}
.seg button[aria-pressed=true]{background:var(--s1); color:#fff; font-weight:600}
.spacer{flex:1}
.count{color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums}

.layout{display:grid; grid-template-columns:minmax(0,1fr) 470px; gap:18px; align-items:start}
@media (max-width:1300px){ .layout{grid-template-columns:minmax(0,1fr)} }

.card{background:var(--surface); border:1px solid var(--border); border-radius:11px}
.tablewrap{overflow:auto; max-height:74vh}
table{border-collapse:separate; border-spacing:0; width:100%; font-variant-numeric:tabular-nums}
th,td{padding:7px 10px; white-space:nowrap; text-align:right}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
thead th{
  position:sticky; top:0; z-index:2; background:var(--surface);
  border-bottom:1px solid var(--axis); color:var(--ink2);
  font-weight:600; font-size:12px; cursor:pointer; user-select:none;
}
thead th:hover{color:var(--ink)}
thead th .ar{color:var(--s1); font-size:10px}
tbody tr{cursor:pointer; border-bottom:1px solid var(--grid)}
tbody tr:hover{background:var(--hi)}
tbody tr[aria-selected=true]{background:var(--s1soft); box-shadow:inset 3px 0 0 var(--s1)}
td{font-size:13px; color:var(--ink)}
.rank{color:var(--muted); font-size:12px}
.nm{font-weight:560}
.cd{color:var(--muted); font-size:11.5px; margin-left:5px}
.tag{font-size:10.5px; padding:1px 6px; border-radius:4px; border:1px solid var(--border); color:var(--ink2)}
.up{color:var(--up)} .down{color:var(--down)} .zero{color:var(--muted)}
.est{color:var(--s2)}
.bar{position:relative}
.bar>i{
  position:absolute; left:0; top:50%; transform:translateY(-50%);
  height:15px; background:var(--s1soft); border-radius:0 3px 3px 0; z-index:0;
}
.bar>span{position:relative; z-index:1}

/* 상세 */
.detail{position:sticky; top:14px; padding:16px}
.detail h2{margin:0 0 2px; font-size:17px; font-weight:650}
.detail .sub{color:var(--ink2); font-size:12.5px; margin-bottom:14px}
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:16px}
.tile{background:var(--plane); border:1px solid var(--border); border-radius:8px; padding:9px 11px}
.tile .k{font-size:11px; color:var(--muted); margin-bottom:3px}
.tile .v{font-size:16px; font-weight:640; font-variant-numeric:tabular-nums}
.tile .s{font-size:11px; color:var(--ink2); font-variant-numeric:tabular-nums}
.legend{display:flex; gap:14px; align-items:center; font-size:12px; color:var(--ink2); margin:4px 0 2px}
.legend i{width:11px; height:2.5px; border-radius:2px; display:inline-block; margin-right:5px; vertical-align:middle}
.chartbox{position:relative}
svg{display:block; width:100%; overflow:visible}
.tip{
  position:absolute; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--surface); border:1px solid var(--border); border-radius:7px;
  padding:7px 10px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.13);
  font-variant-numeric:tabular-nums; white-space:nowrap; z-index:5;
}
.tip b{font-weight:620}
.tip .row{display:flex; gap:9px; justify-content:space-between}
.empty{padding:40px 16px; text-align:center; color:var(--muted); font-size:13px}
.note{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.55}
.foot{margin-top:16px; color:var(--muted); font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>국내 공매도 잔고 대시보드</h1>
  <div class="meta" id="meta"></div>
</header>

<div id="banner"></div>

<div class="controls">
  <input type="search" id="q" placeholder="종목명 · 코드 검색" autocomplete="off">
  <select id="mkt">
    <option value="">전체 시장</option><option>KOSPI</option><option>KOSDAQ</option>
  </select>
  <div class="seg" id="denom">
    <button data-v="list" aria-pressed="true">상장주식수 대비</button>
    <button data-v="float" aria-pressed="false">유동주식수 대비</button>
  </div>
  <div class="spacer"></div>
  <div class="count" id="count"></div>
</div>

<div class="layout">
  <div class="card tablewrap">
    <table id="tbl">
      <thead><tr id="hrow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="card detail" id="detail"></div>
</div>

<div class="foot" id="foot"></div>
</div>

<script>
const F = {
  int: v => v==null ? '–' : Math.round(v).toLocaleString('ko-KR'),
  pct: (v,n=2) => v==null ? '–' : v.toFixed(n) + '%',
  num: (v,n=2) => v==null ? '–' : v.toFixed(n),
  eok: v => v==null ? '–' : (v/1e8).toLocaleString('ko-KR',{maximumFractionDigits:0}) + '억',
  jo:  v => v==null ? '–' : (v/1e12).toFixed(1) + '조',
  sh:  v => {           // 주식수: 억/만 단위 축약
    if(v==null) return '–';
    if(Math.abs(v)>=1e8) return (v/1e8).toFixed(2)+'억';
    if(Math.abs(v)>=1e4) return (v/1e4).toFixed(0)+'만';
    return Math.round(v).toLocaleString('ko-KR');
  },
  sgn: v => {           // 증감(주식수)
    if(v==null) return '<span class="zero">–</span>';
    const c = v>0 ? 'up' : v<0 ? 'down' : 'zero';
    const s = v>0 ? '+' : '';
    return `<span class="${c}">${s}${F.sh(v)}</span>`;
  },
  date: d => d ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : '–',
};

let DATA=null, VIEW=[], SEL=null, DENOM='list';
let SORT={key:'ratioList', dir:-1};

const COLS = () => ([
  {k:'_rank', t:'#',        f:(r,i)=>`<span class="rank">${i+1}</span>`, nosort:true},
  {k:'name',  t:'종목',      f:r=>`<span class="nm">${r.name}</span><span class="cd">${r.code}</span>`},
  {k:'market',t:'시장',      f:r=>`<span class="tag">${r.market}</span>`},
  {k:DENOM==='list'?'ratioList':'ratioFloat', t:DENOM==='list'?'잔고비율(상장)':'잔고비율(유동)',
   f:(r)=>{const v=DENOM==='list'?r.ratioList:r.ratioFloat; const m=VIEW.__max||1;
           return `<div class="bar"><i style="width:${v?Math.max(2,v/m*100):0}%"></i><span>${F.pct(v)}</span></div>`;}},
  {k:DENOM==='list'?'estRatioList':'estRatioFloat', t:'추정비율(D)',
   f:r=>`<span class="est">${F.pct(DENOM==='list'?r.estRatioList:r.estRatioFloat)}</span>`},
  {k:'balQty',t:'공매도잔고', f:r=>F.sh(r.balQty)},
  {k:'balEst',t:'추정잔고(D)',f:r=>`<span class="est">${F.sh(r.balEst)}</span>`},
  {k:'chg1',  t:'1일 증감',  f:r=>F.sgn(r.chg1)},
  {k:'chg5',  t:'5일 증감',  f:r=>F.sgn(r.chg5)},
  {k:'chg20', t:'20일 증감', f:r=>F.sgn(r.chg20)},
  {k:'dtc',   t:'DTC(일)',   f:r=>F.num(r.dtc,1)},
  {k:'listShares', t:'상장주식수', f:r=>F.sh(r.listShares)},
  {k:'floatShares',t:'유동주식수', f:r=>F.sh(r.floatShares)},
  {k:'floatRatio', t:'유동비율',  f:r=>F.pct(r.floatRatio,1)},
  {k:'close', t:'종가',      f:r=>F.int(r.close)},
  {k:'mktcap',t:'시총',      f:r=>F.jo(r.mktcap)},
  {k:'alpha', t:'α',        f:r=>F.num(r.alpha,3)},
  {k:'beta',  t:'β',        f:r=>F.num(r.beta,3)},
  {k:'r2',    t:'R²',       f:r=>F.num(r.r2,2)},
]);

function head(){
  const cols=COLS();
  document.getElementById('hrow').innerHTML = cols.map(c=>{
    const on = SORT.key===c.k;
    const ar = on ? `<span class="ar">${SORT.dir<0?'▼':'▲'}</span>` : '';
    return `<th data-k="${c.k}" ${c.nosort?'data-nosort=1':''} title="${c.t}">${c.t} ${ar}</th>`;
  }).join('');
  document.querySelectorAll('#hrow th').forEach(th=>{
    if(th.dataset.nosort) return;
    th.onclick = () => {
      const k=th.dataset.k;
      SORT = SORT.key===k ? {key:k, dir:-SORT.dir} : {key:k, dir:-1};
      render();
    };
  });
}

function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const mk=document.getElementById('mkt').value;
  return DATA.stocks.filter(r=>
    (!mk || r.market===mk) &&
    (!q || r.name.toLowerCase().includes(q) || r.code.includes(q)));
}

function render(){
  let rows = filtered();
  const k=SORT.key, d=SORT.dir;
  rows.sort((a,b)=>{
    let x=a[k], y=b[k];
    if(typeof x==='string'||typeof y==='string')
      return (x||'').localeCompare(y||'','ko')*(-d);
    if(x==null&&y==null) return 0;
    if(x==null) return 1;            // 결측은 항상 뒤로
    if(y==null) return -1;
    return (x-y)*d;
  });
  VIEW = rows;
  const rk = DENOM==='list'?'ratioList':'ratioFloat';
  VIEW.__max = Math.max(...rows.map(r=>r[rk]||0), 0.001);

  const cols=COLS();
  document.getElementById('tbody').innerHTML = rows.map((r,i)=>
    `<tr data-c="${r.code}" ${SEL===r.code?'aria-selected=true':''}>`
    + cols.map(c=>`<td>${c.f(r,i)}</td>`).join('') + '</tr>').join('');
  document.querySelectorAll('#tbody tr').forEach(tr=>{
    tr.onclick = () => { SEL = tr.dataset.c; render(); detail(SEL); };
  });
  document.getElementById('count').textContent = `${rows.length}종목 / 전체 ${DATA.stocks.length}종목`;
  head();
}

/* ---------------------------------------------------------------- 상세 차트 */
function lineChart(el, cfg){
  const W=430, H=200, P={t:12,r:14,b:24,l:44};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const {dates, series} = cfg;
  const flat = series.flatMap(s=>s.v).filter(v=>v!=null);
  if(!flat.length){ el.innerHTML='<div class="empty">표시할 데이터가 없습니다.</div>'; return; }
  let lo=Math.min(...flat), hi=Math.max(...flat);
  if(lo===hi){ lo-=1; hi+=1; }
  const pad=(hi-lo)*0.12; lo=Math.max(0,lo-pad); hi=hi+pad;
  const X=i=> P.l + (dates.length<2?iw/2:i/(dates.length-1)*iw);
  const Y=v=> P.t + ih - (v-lo)/(hi-lo)*ih;

  const ticks=[]; for(let i=0;i<=4;i++) ticks.push(lo+(hi-lo)*i/4);
  const dl=[]; const n=dates.length;
  [0, Math.floor(n/3), Math.floor(2*n/3), n-1].forEach(i=>{ if(i>=0&&i<n&&!dl.includes(i)) dl.push(i); });

  const path = v => {
    let d='', pen=false;
    v.forEach((y,i)=>{
      if(y==null){ pen=false; return; }
      d += (pen?'L':'M') + X(i).toFixed(1) + ' ' + Y(y).toFixed(1) + ' ';
      pen=true;
    });
    return d.trim();
  };

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cfg.label}">
    ${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"
        stroke="var(--grid)" stroke-width="1"/>`).join('')}
    ${ticks.map(t=>`<text x="${P.l-7}" y="${Y(t)+3.5}" text-anchor="end"
        fill="var(--muted)" font-size="10">${cfg.fmt(t)}</text>`).join('')}
    <line x1="${P.l}" x2="${W-P.r}" y1="${P.t+ih}" y2="${P.t+ih}" stroke="var(--axis)"/>
    ${dl.map(i=>`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}"
        fill="var(--muted)" font-size="10">${dates[i].slice(2,4)}/${dates[i].slice(4,6)}</text>`).join('')}
    ${series.map(s=>`<path d="${path(s.v)}" fill="none" stroke="${s.c}"
        stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
        ${s.dash?'stroke-dasharray="4 3"':''}/>`).join('')}
    <g id="cross" opacity="0">
      <line y1="${P.t}" y2="${P.t+ih}" stroke="var(--axis)" stroke-width="1"/>
      ${series.map(s=>`<circle r="4" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    </g>
    <rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>
  </svg><div class="tip"></div>`;

  const svg=el.querySelector('svg'), tip=el.querySelector('.tip');
  const cross=el.querySelector('#cross'), line=cross.querySelector('line');
  const dots=[...cross.querySelectorAll('circle')];
  el.querySelector('#hit').addEventListener('pointermove', e=>{
    const r=svg.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width*W;
    let i=Math.round((px-P.l)/iw*(dates.length-1));
    i=Math.max(0,Math.min(dates.length-1,i));
    cross.setAttribute('opacity','1');
    line.setAttribute('x1',X(i)); line.setAttribute('x2',X(i));
    series.forEach((s,j)=>{
      const v=s.v[i];
      if(v==null){ dots[j].setAttribute('opacity','0'); return; }
      dots[j].setAttribute('opacity','1');
      dots[j].setAttribute('cx',X(i)); dots[j].setAttribute('cy',Y(v));
    });
    tip.style.opacity='1';
    tip.innerHTML = `<b>${F.date(dates[i])}</b>`
      + series.map(s=>`<div class="row"><span style="color:${s.c}">${s.n}</span>
          <span>${s.v[i]==null?'–':cfg.fmt(s.v[i])}</span></div>`).join('');
    const bx=svg.getBoundingClientRect();
    const left=(X(i)/W)*bx.width;
    tip.style.left = Math.min(bx.width-tip.offsetWidth-4, Math.max(0,left+10)) + 'px';
    tip.style.top = '4px';
  });
  el.querySelector('#hit').addEventListener('pointerleave', ()=>{
    cross.setAttribute('opacity','0'); tip.style.opacity='0';
  });
}

function detail(code){
  const el=document.getElementById('detail');
  const r=DATA.stocks.find(s=>s.code===code);
  const s=DATA.series[code];
  if(!r){ el.innerHTML='<div class="empty">종목을 선택하세요.</div>'; return; }

  const isL = DENOM==='list';
  const ratioNow = isL?r.ratioList:r.ratioFloat;
  const estNow   = isL?r.estRatioList:r.estRatioFloat;

  el.innerHTML = `
    <h2>${r.name} <span class="cd">${r.code}</span></h2>
    <div class="sub">${r.market} · 종가 ${F.int(r.close)}원 · 시총 ${F.jo(r.mktcap)}</div>
    <div class="tiles">
      <div class="tile"><div class="k">공매도잔고 ${DATA.meta.knownDate?'('+F.date(DATA.meta.knownDate)+')':''}</div>
        <div class="v">${F.sh(r.balQty)}</div><div class="s">${F.pct(ratioNow)} ${isL?'상장':'유동'} 대비</div></div>
      <div class="tile"><div class="k">추정잔고 (D)</div>
        <div class="v est">${F.sh(r.balEst)}</div><div class="s">${F.pct(estNow)}</div></div>
      <div class="tile"><div class="k">5일 증감</div>
        <div class="v">${F.sgn(r.chg5)}</div><div class="s">20일 ${F.sgn(r.chg20)}</div></div>
      <div class="tile"><div class="k">상장주식수</div>
        <div class="v">${F.sh(r.listShares)}</div><div class="s">&nbsp;</div></div>
      <div class="tile"><div class="k">유동주식수</div>
        <div class="v">${F.sh(r.floatShares)}</div><div class="s">유동비율 ${F.pct(r.floatRatio,1)}</div></div>
      <div class="tile"><div class="k">DTC</div>
        <div class="v">${F.num(r.dtc,1)}</div><div class="s">20일 평균거래량 기준</div></div>
    </div>

    <div class="legend">
      <span><i style="background:var(--s1)"></i>상장주식수 대비</span>
      <span><i style="background:var(--s2)"></i>유동주식수 대비</span>
    </div>
    <div class="chartbox" id="c1"></div>
    <div class="note" id="n1"></div>`;

  if(!s || !s.ratioList){
    document.getElementById('c1').innerHTML =
      '<div class="empty">공매도 잔고 시계열이 아직 수집되지 않았습니다.</div>';
  } else {
    lineChart(document.getElementById('c1'), {
      label:`${r.name} 공매도 잔고비율 추이`,
      dates:s.dates,
      fmt:v=>v.toFixed(1)+'%',
      series:[
        {n:'상장 대비', v:s.ratioList, c:'var(--s1)'},
        {n:'유동 대비', v:s.ratioFloat, c:'var(--s2)'},
      ],
    });
  }
  document.getElementById('n1').innerHTML = r.alpha==null ? '' :
    `추정계수 α=<b>${F.num(r.alpha,3)}</b> (대차잔고 증감 반영률),
     β=<b>${F.num(r.beta,3)}</b> (공매도 거래량 잔존율),
     R²=<b>${F.num(r.r2,2)}</b>, 표본 ${F.int(r.nObs)}일
     ${r.coefSource==='pooled'?'· <b>풀링 계수 폴백</b>':''}`;
}

/* ------------------------------------------------------------------- 부팅 */
fetch('dashboard_data.json').then(r=>r.json()).then(d=>{
  DATA=d;
  const m=d.meta;
  document.getElementById('meta').innerHTML =
    `기준일 <b>${F.date(m.asof)}</b> · 공매도 확정일 <b>${m.knownDate?F.date(m.knownDate):'–'}</b>
     · 유니버스 <b>${m.universe}</b>종목 (시총 ${(m.minMktcap/1e12).toFixed(0)}조 이상 개별 보통주)
     · 생성 ${m.generatedAt}`;
  if(!m.hasShort){
    document.getElementById('banner').innerHTML =
      `<div class="banner"><b>공매도·대차 데이터 미수집</b> — KRX 로그인 세션이 필요합니다.
       크롬 로그인 후 <code>py scripts\\krx_short.py</code> → <code>py scripts\\estimate.py</code>
       → <code>py scripts\\build_dashboard.py</code> 순으로 실행하면 잔고·증감·추정 컬럼이 채워집니다.</div>`;
    SORT={key:'mktcap', dir:-1};
  }
  document.getElementById('foot').innerHTML =
    `추정식: <b>Est(D) = Bal(D-2) + Σ<sub>t∈{D-1,D}</sub> [ α·ΔLoan(t) + β·ShortVol(t) ]</b>
     — α·β는 종목별 최근 ${'20~60'}거래일 실제 잔고 증감에 대한 절편 없는 OLS로 매일 재추정.
     DTC = 공매도잔고 ÷ 20일 평균거래량. 데이터: KRX(시세·공매도·대차), FnGuide(유동주식수).`;
  render();
  detail(VIEW[0]?.code);
  SEL = VIEW[0]?.code; render();
});

document.getElementById('q').oninput = render;
document.getElementById('mkt').onchange = render;
document.querySelectorAll('#denom button').forEach(b=>{
  b.onclick = () => {
    DENOM=b.dataset.v;
    document.querySelectorAll('#denom button').forEach(x=>
      x.setAttribute('aria-pressed', String(x===b)));
    if(SORT.key==='ratioList'||SORT.key==='ratioFloat')
      SORT.key = DENOM==='list'?'ratioList':'ratioFloat';
    if(SORT.key==='estRatioList'||SORT.key==='estRatioFloat')
      SORT.key = DENOM==='list'?'estRatioList':'estRatioFloat';
    render(); if(SEL) detail(SEL);
  };
});
</script>
